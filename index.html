<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rod's Tracker - Debt & Salary Allocator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* iOS safe area bottom padding support */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }
    </style>
</head>
<body class="bg-[#fbfbfa] text-[#1c1d1f] font-sans antialiased selection:bg-[#5a7865] selection:text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Lucide Icon Component wrapper for browser CDN
        const IconComponent = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const LayoutDashboard = (p) => <IconComponent name="layout-dashboard" {...p} />;
        const CheckSquare = (p) => <IconComponent name="check-square" {...p} />;
        const Wallet = (p) => <IconComponent name="wallet" {...p} />;
        const CreditCard = (p) => <IconComponent name="credit-card" {...p} />;
        const BarChart3 = (p) => <IconComponent name="bar-chart-3" {...p} />;
        const CalendarIcon = (p) => <IconComponent name="calendar" {...p} />;
        const Download = (p) => <IconComponent name="download" {...p} />;
        const RotateCcw = (p) => <IconComponent name="rotate-ccw" {...p} />;
        const Plus = (p) => <IconComponent name="plus" {...p} />;
        const Search = (p) => <IconComponent name="search" {...p} />;
        const CheckCircle2 = (p) => <IconComponent name="check-circle-2" {...p} />;
        const Clock = (p) => <IconComponent name="clock" {...p} />;
        const DollarSign = (p) => <IconComponent name="dollar-sign" {...p} />;
        const ShieldCheck = (p) => <IconComponent name="shield-check" {...p} />;
        const Building2 = (p) => <IconComponent name="building-2" {...p} />;
        const Save = (p) => <IconComponent name="save" {...p} />;
        const Menu = (p) => <IconComponent name="menu" {...p} />;
        const X = (p) => <IconComponent name="x" {...p} />;

        const INITIAL_LOANS = [
          { id: 'loan-1', name: 'TikTok', monthlyAmount: 1878, originalPrincipal: 3756, dueDate: 18, totalMonths: 2, payoffDate: '2027-01-18', splits: 2, icon: 'ShoppingBag' },
          { id: 'loan-2', name: 'Shopee', monthlyAmount: 788.04, originalPrincipal: 7092.36, dueDate: 11, totalMonths: 9, payoffDate: '2027-07-11', splits: 2, icon: 'ShoppingBag' },
          { id: 'loan-3', name: 'HC Qwarta', monthlyAmount: 1500, originalPrincipal: 24000, dueDate: 24, totalMonths: 16, payoffDate: '2028-02-24', splits: 2, icon: 'CreditCard' },
          { id: 'loan-4', name: 'HC 150K', monthlyAmount: 7519, originalPrincipal: 195494, dueDate: 6, totalMonths: 26, payoffDate: '2029-01-06', splits: 1, icon: 'Landmark' },
          { id: 'loan-5', name: 'HC 20K', monthlyAmount: 1558, originalPrincipal: 15580, dueDate: 28, totalMonths: 10, payoffDate: '2027-08-28', splits: 2, icon: 'CreditCard' },
          { id: 'loan-6', name: 'GCash', monthlyAmount: 571.17, originalPrincipal: 3998.19, dueDate: 30, totalMonths: 7, payoffDate: '2027-05-30', splits: 1, icon: 'Smartphone' },
          { id: 'loan-7', name: 'Maya CC', monthlyAmount: 3000, originalPrincipal: 54000, dueDate: 13, totalMonths: 18, payoffDate: '2028-05-13', splits: 1, icon: 'CreditCard' },
          { id: 'loan-8', name: 'Atome Cash', monthlyAmount: 5355, originalPrincipal: 48195, dueDate: 15, totalMonths: 9, payoffDate: '2027-08-15', splits: 1, startMonth: '2027-02', icon: 'Coins' },
          { id: 'loan-9', name: 'Uno Bank', monthlyAmount: 4100, originalPrincipal: 20500, dueDate: 1, totalMonths: 5, payoffDate: '2027-04-01', splits: 1, icon: 'Building2' },
          { id: 'loan-10', name: 'BDO CC', monthlyAmount: 1000, originalPrincipal: 18000, dueDate: 14, totalMonths: 18, payoffDate: '2028-05-14', splits: 1, icon: 'CreditCard' },
          { id: 'loan-11', name: 'Car', monthlyAmount: 7250, originalPrincipal: 174000, dueDate: 18, totalMonths: 24, payoffDate: '2028-10-18', splits: 2, icon: 'Car' }
        ];

        const formatAlphaDate = (dateStr) => {
          if (!dateStr) return '-';
          const parts = dateStr.split('-');
          if (parts.length !== 3) return dateStr;
          const [year, month, day] = parts;
          const dateObj = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
          if (isNaN(dateObj.getTime())) return dateStr;
          return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        };

        const generateSalaryPeriods = () => {
          const periods = [];
          const startYear = 2026;
          const endYear = 2028;
          for (let year = startYear; year <= endYear; year++) {
            const startMonth = year === 2026 ? 11 : 1;
            for (let month = startMonth; month <= 12; month++) {
              const monthName = new Date(year, month - 1, 1).toLocaleString('default', { month: 'long' });
              const mStr = month < 10 ? `0${month}` : `${month}`;
              periods.push({
                id: `${year}-${mStr}-P1`,
                name: `${monthName} 1–15, ${year}`,
                year, month, half: 1, salary: 25000
              });
              periods.push({
                id: `${year}-${mStr}-P2`,
                name: `${monthName} 16–${new Date(year, month, 0).getDate()}, ${year}`,
                year, month, half: 2, salary: 25000
              });
            }
          }
          return periods;
        };

        const generateInitialPayments = (periods) => {
          const payments = [];
          let idCounter = 1;
          periods.forEach((period) => {
            const { year, month, half, id: periodId, name: periodName } = period;
            const addP = (loanName, instNum, actualDueDateStr, amount, remarks = '') => {
              payments.push({
                id: `pmt-${idCounter++}`,
                loanName,
                installmentNumber: instNum,
                periodId,
                periodName,
                dueDate: actualDueDateStr,
                amount,
                status: 'PENDING',
                paidDate: null,
                remarks: remarks || `Scheduled allocation for ${periodName}`
              });
            };
            const monthStr = month < 10 ? `0${month}` : `${month}`;
            const nextMonth = month === 12 ? 1 : month + 1;
            const nextYear = month === 12 ? year + 1 : year;
            const nextMonthStr = nextMonth < 10 ? `0${nextMonth}` : `${nextMonth}`;

            if (year === 2026 && (month === 11 || month === 12)) {
              if (half === 1) addP('TikTok', 2, `${year}-${monthStr}-18`, 1878.00);
              else addP('TikTok', 1, `${nextYear}-${nextMonthStr}-18`, 939.00);
            }
            if ((year === 2026 && month >= 11) || (year === 2027 && month <= 7)) {
              if (half === 1) addP('Shopee', 2, `${year}-${monthStr}-11`, 788.04);
              else addP('Shopee', 1, `${nextYear}-${nextMonthStr}-11`, 394.02);
            }
            if ((year === 2026 && month >= 11) || year === 2027 || (year === 2028 && month <= 2)) {
              if (half === 1) addP('HC Qwarta', 2, `${year}-${monthStr}-24`, 1500.00);
              else addP('HC Qwarta', 1, `${nextYear}-${nextMonthStr}-24`, 750.00);
            }
            if (year >= 2026 && year <= 2028) {
              if (!(year === 2026 && month < 11)) {
                if (half === 1) addP('HC 150K', 1, `${nextYear}-${nextMonthStr}-06`, 3759.50);
                else addP('HC 150K', 2, `${nextYear}-${nextMonthStr}-06`, 3759.50);
              }
            }
            if ((year === 2026 && month >= 11) || (year === 2027 && month <= 8)) {
              if (half === 1) addP('HC 20K', 2, `${year}-${monthStr}-28`, 1558.00);
              else addP('HC 20K', 1, `${nextYear}-${nextMonthStr}-28`, 779.00);
            }
            if ((year === 2026 && month >= 11) || (year === 2027 && month <= 5)) {
              if (half === 1) addP('GCash', 1, `${year}-${monthStr}-30`, 285.56);
              else addP('GCash', 2, `${year}-${monthStr}-30`, 285.61);
            }
            if ((year === 2026 && month >= 11) || year === 2027 || (year === 2028 && month <= 4)) {
              if (half === 1) addP('Maya CC', 1, `${nextYear}-${nextMonthStr}-13`, 1500.00);
              else addP('Maya CC', 2, `${nextYear}-${nextMonthStr}-13`, 1500.00);
            }
            if (year === 2027 && month >= 2 && month <= 10) {
              if (half === 1) addP('Atome Cash', 1, `${year}-${monthStr}-15`, 2677.50, 'Starts Feb 2027');
              else addP('Atome Cash', 2, `${year}-${monthStr}-15`, 2677.50, 'Starts Feb 2027');
            }
            if ((year === 2026 && month >= 11) || (year === 2027 && month <= 3)) {
              if (half === 1) addP('Uno Bank', 1, `${nextYear}-${nextMonthStr}-01`, 2050.00);
              else addP('Uno Bank', 2, `${nextYear}-${nextMonthStr}-01`, 2050.00);
            }
            if ((year === 2026 && month >= 11) || year === 2027 || (year === 2028 && month <= 4)) {
              if (half === 1) addP('BDO CC', 1, `${nextYear}-${nextMonthStr}-14`, 500.00);
              else addP('BDO CC', 2, `${nextYear}-${nextMonthStr}-14`, 500.00);
            }
            if ((year === 2026 && month >= 11) || (year <= 2028 && month <= 10)) {
              if (half === 1) addP('Car', 2, `${year}-${monthStr}-18`, 3625.00);
              else addP('Car', 1, `${nextYear}-${nextMonthStr}-18`, 3625.00);
            }
          });
          return payments;
        };

        const formatPHP = (amount) => {
          return new Intl.NumberFormat('en-PH', {
            style: 'currency',
            currency: 'PHP',
            minimumFractionDigits: 2
          }).format(amount || 0).replace('PHP', '₱');
        };

        function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [lastSavedTime, setLastSavedTime] = useState('');
          const [isMenuOpen, setIsMenuOpen] = useState(false);

          const [periods, setPeriods] = useState(() => {
            try {
              const saved = localStorage.getItem('rods_tracker_periods');
              if (saved) return JSON.parse(saved);
            } catch (e) {}
            return generateSalaryPeriods();
          });

          const [payments, setPayments] = useState(() => {
            try {
              const saved = localStorage.getItem('rods_tracker_payments');
              if (saved) return JSON.parse(saved);
            } catch (e) {}
            return generateInitialPayments(generateSalaryPeriods());
          });

          const [loans, setLoans] = useState(() => {
            try {
              const saved = localStorage.getItem('rods_tracker_loans');
              if (saved) return JSON.parse(saved);
            } catch (e) {}
            return INITIAL_LOANS;
          });

          const [selectedPeriodId, setSelectedPeriodId] = useState('2026-11-P1');
          const [trackerFilterStatus, setTrackerFilterStatus] = useState('ALL');
          const [trackerFilterLoan, setTrackerFilterLoan] = useState('ALL');
          const [trackerSearch, setTrackerSearch] = useState('');
          const [isAddPaymentModalOpen, setIsAddPaymentModalOpen] = useState(false);
          const [newPayment, setNewPayment] = useState({
            loanName: 'TikTok',
            installmentNumber: 1,
            periodId: '2026-11-P1',
            dueDate: '2026-11-18',
            amount: 1000,
            remarks: ''
          });

          useEffect(() => {
            try {
              localStorage.setItem('rods_tracker_periods', JSON.stringify(periods));
              localStorage.setItem('rods_tracker_payments', JSON.stringify(payments));
              localStorage.setItem('rods_tracker_loans', JSON.stringify(loans));
              setLastSavedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            } catch (e) {}
          }, [periods, payments, loans]);

          const togglePaymentStatus = (paymentId) => {
            setPayments(prev => prev.map(pmt => {
              if (pmt.id === paymentId) {
                const isNowPaid = pmt.status !== 'PAID';
                return {
                  ...pmt,
                  status: isNowPaid ? 'PAID' : 'PENDING',
                  paidDate: isNowPaid ? new Date().toISOString().split('T')[0] : null
                };
              }
              return pmt;
            }));
          };

          const handleSalaryChange = (periodId, newSalary) => {
            setPeriods(prev => prev.map(p => p.id === periodId ? { ...p, salary: parseFloat(newSalary) || 0 } : p));
          };

          const handleAddPayment = (e) => {
            e.preventDefault();
            const selectedPeriodObj = periods.find(p => p.id === newPayment.periodId) || periods[0];
            const newEntry = {
              id: `custom-pmt-${Date.now()}`,
              loanName: newPayment.loanName,
              installmentNumber: parseInt(newPayment.installmentNumber) || 1,
              periodId: newPayment.periodId,
              periodName: selectedPeriodObj.name,
              dueDate: newPayment.dueDate,
              amount: parseFloat(newPayment.amount) || 0,
              status: 'PENDING',
              paidDate: null,
              remarks: newPayment.remarks || 'Custom added payment'
            };
            setPayments(prev => [newEntry, ...prev]);
            setIsAddPaymentModalOpen(false);
          };

          const globalMetrics = useMemo(() => {
            const totalScheduledAmount = payments.reduce((sum, p) => sum + p.amount, 0);
            const totalPaidAmount = payments.filter(p => p.status === 'PAID').reduce((sum, p) => sum + p.amount, 0);
            const remainingDebt = totalScheduledAmount - totalPaidAmount;
            const completionRate = totalScheduledAmount > 0 ? (totalPaidAmount / totalScheduledAmount) * 100 : 0;
            return {
              totalScheduledAmount,
              totalPaidAmount,
              remainingDebt,
              totalPaymentsCount: payments.length,
              completedPaymentsCount: payments.filter(p => p.status === 'PAID').length,
              pendingPaymentsCount: payments.filter(p => p.status === 'PENDING').length,
              completionRate,
              activeLoansCount: loans.length
            };
          }, [payments, loans]);

          const currentPeriodData = useMemo(() => {
            const periodObj = periods.find(p => p.id === selectedPeriodId) || periods[0];
            const periodPayments = payments.filter(p => p.periodId === selectedPeriodId);
            const salaryReceived = periodObj.salary || 0;
            const totalScheduledDebt = periodPayments.reduce((sum, p) => sum + p.amount, 0);
            const totalPaidDebt = periodPayments.filter(p => p.status === 'PAID').reduce((sum, p) => sum + p.amount, 0);
            const projectedRemainingSalary = salaryReceived - totalScheduledDebt;
            const actualAvailableBalance = salaryReceived - totalPaidDebt;
            const dtiRatio = salaryReceived > 0 ? (totalScheduledDebt / salaryReceived) * 100 : 0;
            return {
              periodObj, periodPayments, salaryReceived, totalScheduledDebt, totalPaidDebt,
              projectedRemainingSalary, actualAvailableBalance, dtiRatio
            };
          }, [selectedPeriodId, periods, payments]);

          const handleResetData = () => {
            if (window.confirm("Are you sure you want to reset all data back to the default schedule?")) {
              const defaultPeriods = generateSalaryPeriods();
              const defaultPayments = generateInitialPayments(defaultPeriods);
              setPeriods(defaultPeriods);
              setPayments(defaultPayments);
              setLoans(INITIAL_LOANS);
              localStorage.removeItem('rods_tracker_periods');
              localStorage.removeItem('rods_tracker_payments');
              localStorage.removeItem('rods_tracker_loans');
            }
          };

          const handleExportCSV = () => {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID, Loan Name, Installment, Salary Period, Due Date, Amount, Status, Date Paid, Remarks\n";
            payments.forEach(p => {
              csvContent += `"${p.id}","${p.loanName}","${p.installmentNumber}","${p.periodName}","${p.dueDate}","${p.amount}","${p.status}","${p.paidDate || ''}","${p.remarks || ''}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "rods_tracker_schedule.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
          };

          const navItems = [
            { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
            { id: 'tracker', label: 'Tracker', icon: CheckSquare },
            { id: 'salary', label: 'Salary', icon: Wallet },
            { id: 'loans', label: 'Loans', icon: CreditCard },
            { id: 'analytics', label: 'Analytics', icon: BarChart3 },
            { id: 'calendar', label: 'Calendar', icon: CalendarIcon },
          ];

          return (
            <div className="min-h-screen bg-[#fbfbfa] text-[#1c1d1f] flex flex-col pb-24 sm:pb-0">
              
              {/* iPhone-Friendly Sticky Top Bar */}
              <header className="sticky top-0 z-30 bg-[#fbfbfa]/90 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="bg-[#5a7865] text-white p-2 rounded-xl shadow-xs">
                    <ShieldCheck className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="font-bold text-sm tracking-tight text-[#1c1d1f] leading-tight">Rod's Tracker</h1>
                    <p className="text-[10px] text-stone-500 font-medium">iPhone 13 Optimized</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setIsMenuOpen(true)}
                    className="p-2 bg-stone-100 hover:bg-stone-200 rounded-xl text-stone-700 transition"
                    aria-label="Open Menu"
                  >
                    <Menu className="w-5 h-5" />
                  </button>
                </div>
              </header>

              {/* Slide-out Menu Drawer for Settings / Export / Reset */}
              {isMenuOpen && (
                <div className="fixed inset-0 z-50 flex justify-end bg-black/40 backdrop-blur-xs">
                  <div className="w-4/5 max-w-xs bg-white h-full p-5 flex flex-col justify-between shadow-2xl animate-in slide-in-from-right duration-200">
                    <div>
                      <div className="flex items-center justify-between pb-4 border-b border-stone-100 mb-4">
                        <h3 className="font-bold text-base text-stone-900">System Actions</h3>
                        <button onClick={() => setIsMenuOpen(false)} className="p-1 rounded-lg text-stone-400 hover:text-stone-700">
                          <X className="w-5 h-5" />
                        </button>
                      </div>
                      <div className="space-y-3">
                        {lastSavedTime && (
                          <div className="p-3 bg-stone-50 rounded-xl text-xs text-[#5a7865] font-semibold flex items-center gap-2">
                            <Save className="w-4 h-4" /> State Saved ({lastSavedTime})
                          </div>
                        )}
                        <button
                          onClick={() => { handleExportCSV(); setIsMenuOpen(false); }}
                          className="w-full flex items-center gap-3 px-3.5 py-3 text-xs font-semibold text-stone-700 bg-stone-50 hover:bg-stone-100 rounded-xl transition"
                        >
                          <Download className="w-4 h-4 text-[#5a7865]" /> Export Schedule CSV
                        </button>
                        <button
                          onClick={() => { handleResetData(); setIsMenuOpen(false); }}
                          className="w-full flex items-center gap-3 px-3.5 py-3 text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 rounded-xl transition"
                        >
                          <RotateCcw className="w-4 h-4 text-amber-600" /> Restore Default Schedule
                        </button>
                      </div>
                    </div>
                    <div className="text-center pt-4 border-t border-stone-100">
                      <p className="text-[11px] text-stone-400">Rod's Financial Allocator v2.0</p>
                    </div>
                  </div>
                </div>
              )}

              {/* Main Content Body */}
              <main className="flex-1 p-4 space-y-5 max-w-lg mx-auto w-full">
                <div className="flex items-center justify-between pt-1">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-[#5a7865]">Overview</span>
                    <h2 className="text-xl font-extrabold tracking-tight capitalize text-[#1c1d1f]">
                      {activeTab === 'dashboard' && 'Dashboard'}
                      {activeTab === 'tracker' && 'Debt Tracker'}
                      {activeTab === 'salary' && 'Salary & Cutoffs'}
                      {activeTab === 'loans' && 'Loan Portfolio'}
                      {activeTab === 'analytics' && 'Analytics'}
                      {activeTab === 'calendar' && 'Timeline'}
                    </h2>
                  </div>
                  <div className="bg-white border border-stone-200/85 rounded-xl px-3 py-1.5 flex items-center gap-2 shadow-xs">
                    <span className="text-xs font-bold text-[#5a7865]">{globalMetrics.completionRate.toFixed(0)}% Paid</span>
                  </div>
                </div>

                {activeTab === 'dashboard' && (
                  <div className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <div className="flex items-center justify-between text-stone-500 mb-1">
                          <span className="text-[11px] font-medium">Total Scheduled</span>
                          <DollarSign className="w-3.5 h-3.5 text-stone-400" />
                        </div>
                        <p className="text-lg font-bold text-[#1c1d1f]">{formatPHP(globalMetrics.totalScheduledAmount)}</p>
                        <p className="text-[10px] text-stone-400 mt-0.5">281 items total</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <div className="flex items-center justify-between text-stone-500 mb-1">
                          <span className="text-[11px] font-medium">Total Paid</span>
                          <CheckCircle2 className="w-3.5 h-3.5 text-[#5a7865]" />
                        </div>
                        <p className="text-lg font-bold text-[#5a7865]">{formatPHP(globalMetrics.totalPaidAmount)}</p>
                        <div className="w-full bg-stone-100 rounded-full h-1 mt-2 overflow-hidden">
                          <div className="bg-[#5a7865] h-full rounded-full" style={{ width: `${globalMetrics.completionRate}%` }}></div>
                        </div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <div className="flex items-center justify-between text-stone-500 mb-1">
                          <span className="text-[11px] font-medium">Remaining Debt</span>
                          <Clock className="w-3.5 h-3.5 text-[#4a6b82]" />
                        </div>
                        <p className="text-lg font-bold text-[#4a6b82]">{formatPHP(globalMetrics.remainingDebt)}</p>
                        <p className="text-[10px] text-stone-400 mt-0.5">{globalMetrics.pendingPaymentsCount} pending</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <div className="flex items-center justify-between text-stone-500 mb-1">
                          <span className="text-[11px] font-medium">Active Loans</span>
                          <Building2 className="w-3.5 h-3.5 text-stone-400" />
                        </div>
                        <p className="text-lg font-bold text-[#1c1d1f]">{globalMetrics.activeLoansCount}</p>
                        <p className="text-[10px] text-stone-400 mt-0.5">52 cutoffs</p>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-stone-200/85 shadow-xs space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-bold text-[#1c1d1f]">Loan Contribution Breakdown</h3>
                        <span className="text-[11px] text-stone-400 font-medium">Paid / Total</span>
                      </div>
                      <div className="space-y-3 max-h-[280px] overflow-y-auto pr-1">
                        {loans.map(loan => {
                          const loanTotal = payments.filter(p => p.loanName === loan.name).reduce((s, p) => s + p.amount, 0);
                          const loanPaid = payments.filter(p => p.loanName === loan.name && p.status === 'PAID').reduce((s, p) => s + p.amount, 0);
                          const pct = loanTotal > 0 ? (loanPaid / loanTotal) * 100 : 0;
                          return (
                            <div key={loan.id} className="space-y-1">
                              <div className="flex justify-between text-xs">
                                <span className="font-semibold text-stone-800">{loan.name}</span>
                                <span className="text-stone-500 text-[11px]">{formatPHP(loanPaid)} ({pct.toFixed(0)}%)</span>
                              </div>
                              <div className="w-full bg-stone-100 rounded-full h-1.5 overflow-hidden flex">
                                <div className="bg-[#5a7865] h-full transition-all duration-300" style={{ width: `${pct}%` }}></div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'tracker' && (
                  <div className="space-y-3">
                    <div className="bg-white p-3 rounded-2xl border border-stone-200/85 shadow-xs space-y-2.5">
                      <div className="relative">
                        <Search className="w-4 h-4 absolute left-3 top-2.5 text-stone-400" />
                        <input
                          type="text"
                          placeholder="Search loan or period..."
                          value={trackerSearch}
                          onChange={(e) => setTrackerSearch(e.target.value)}
                          className="w-full pl-9 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        />
                      </div>
                      <div className="flex gap-1 bg-stone-100 p-1 rounded-xl">
                        {['ALL', 'PENDING', 'PAID'].map(st => (
                          <button
                            key={st}
                            onClick={() => setTrackerFilterStatus(st)}
                            className={`flex-1 py-1.5 rounded-lg text-[11px] font-semibold transition ${
                              trackerFilterStatus === st ? 'bg-white text-stone-900 shadow-xs' : 'text-stone-500'
                            }`}
                          >
                            {st}
                          </button>
                        ))}
                      </div>
                      <div className="flex gap-2">
                        <select
                          value={trackerFilterLoan}
                          onChange={(e) => setTrackerFilterLoan(e.target.value)}
                          className="flex-1 py-2 px-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        >
                          <option value="ALL">All Biller Loans</option>
                          {loans.map(l => (
                            <option key={l.id} value={l.name}>{l.name}</option>
                          ))}
                        </select>
                        <button
                          onClick={() => setIsAddPaymentModalOpen(true)}
                          className="px-3 py-2 bg-[#5a7865] text-white rounded-xl text-xs font-semibold hover:bg-[#4a6554] transition flex items-center gap-1 shrink-0 shadow-xs"
                        >
                          <Plus className="w-3.5 h-3.5" /> Add
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2 max-h-[62vh] overflow-y-auto pr-1">
                      {payments.filter(p => {
                        const matchesStatus = trackerFilterStatus === 'ALL' || p.status === trackerFilterStatus;
                        const matchesLoan = trackerFilterLoan === 'ALL' || p.loanName === trackerFilterLoan;
                        const matchesSearch = p.loanName.toLowerCase().includes(trackerSearch.toLowerCase()) ||
                          p.periodName.toLowerCase().includes(trackerSearch.toLowerCase());
                        return matchesStatus && matchesLoan && matchesSearch;
                      }).map((pmt) => {
                        const isPaid = pmt.status === 'PAID';
                        return (
                          <div key={pmt.id} className={`bg-white p-3.5 rounded-2xl border shadow-xs flex items-center justify-between gap-3 transition ${isPaid ? 'border-emerald-200 bg-emerald-50/20' : 'border-stone-200/85'}`}>
                            <div className="flex items-center gap-3">
                              <input
                                type="checkbox"
                                checked={isPaid}
                                onChange={() => togglePaymentStatus(pmt.id)}
                                className="w-5 h-5 rounded text-[#5a7865] focus:ring-[#5a7865] cursor-pointer shrink-0"
                              />
                              <div>
                                <div className="flex items-center gap-1.5">
                                  <p className="text-xs font-bold text-stone-900">{pmt.loanName}</p>
                                  <span className="px-1.5 py-0.5 bg-stone-100 rounded text-[9px] font-semibold text-stone-600">Split #{pmt.installmentNumber}</span>
                                </div>
                                <p className="text-[11px] text-stone-500 mt-0.5">{pmt.periodName}</p>
                                <p className="text-[10px] text-[#4a6b82] font-medium mt-0.5">Due: {formatAlphaDate(pmt.dueDate)}</p>
                              </div>
                            </div>
                            <div className="text-right shrink-0">
                              <p className="text-xs font-bold text-stone-900">{formatPHP(pmt.amount)}</p>
                              <span className={`inline-block mt-1 text-[9px] font-bold px-2 py-0.5 rounded-full ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                {pmt.status}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {activeTab === 'salary' && (
                  <div className="space-y-4">
                    <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs space-y-3">
                      <div>
                        <label className="text-[10px] font-bold uppercase tracking-wider text-stone-400 block mb-1">Select Period Cutoff</label>
                        <select
                          value={selectedPeriodId}
                          onChange={(e) => setSelectedPeriodId(e.target.value)}
                          className="w-full py-2.5 px-3 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold text-stone-900 focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        >
                          {periods.map((p) => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold uppercase tracking-wider text-stone-400 block mb-1">Salary Input (₱)</label>
                        <div className="relative">
                          <span className="absolute left-3 top-2.5 text-stone-500 font-bold text-xs">₱</span>
                          <input
                            type="number"
                            value={currentPeriodData.salaryReceived}
                            onChange={(e) => handleSalaryChange(selectedPeriodId, e.target.value)}
                            className="w-full pl-7 pr-3 py-2 bg-stone-50 border border-stone-200 rounded-xl font-bold text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                          />
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <p className="text-[11px] font-medium text-stone-500">Salary Received</p>
                        <p className="text-base font-bold text-stone-900 mt-1">{formatPHP(currentPeriodData.salaryReceived)}</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <p className="text-[11px] font-medium text-stone-500">Scheduled Debt</p>
                        <p className="text-base font-bold text-amber-600 mt-1">{formatPHP(currentPeriodData.totalScheduledDebt)}</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <p className="text-[11px] font-medium text-stone-500">Projected Left</p>
                        <p className={`text-base font-bold mt-1 ${currentPeriodData.projectedRemainingSalary >= 0 ? 'text-[#5a7865]' : 'text-rose-600'}`}>
                          {formatPHP(currentPeriodData.projectedRemainingSalary)}
                        </p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs">
                        <p className="text-[11px] font-medium text-stone-500">Actual Available</p>
                        <p className="text-base font-bold text-[#4a6b82] mt-1">{formatPHP(currentPeriodData.actualAvailableBalance)}</p>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'loans' && (
                  <div className="space-y-3 max-h-[70vh] overflow-y-auto pr-1">
                    {loans.map(loan => {
                      const loanPmts = payments.filter(p => p.loanName === loan.name);
                      const totalPaid = loanPmts.filter(p => p.status === 'PAID').reduce((s, p) => s + p.amount, 0);
                      const totalScheduled = loanPmts.reduce((s, p) => s + p.amount, 0);
                      const remaining = totalScheduled - totalPaid;
                      const completionPct = totalScheduled > 0 ? (totalPaid / totalScheduled) * 100 : 0;
                      return (
                        <div key={loan.id} className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <h3 className="text-sm font-bold text-stone-900">{loan.name}</h3>
                              <p className="text-[10px] text-stone-400 mt-0.5">Payoff: <span className="font-semibold text-stone-700">{formatAlphaDate(loan.payoffDate)}</span></p>
                            </div>
                            <span className="text-xs font-bold text-[#5a7865]">{completionPct.toFixed(0)}%</span>
                          </div>
                          <div className="grid grid-cols-3 gap-2 text-[11px] bg-stone-50 p-2.5 rounded-xl border border-stone-100">
                            <div>
                              <span className="text-stone-400 block text-[9px]">Monthly</span>
                              <span className="font-bold text-stone-800">{formatPHP(loan.monthlyAmount)}</span>
                            </div>
                            <div>
                              <span className="text-stone-400 block text-[9px]">Paid</span>
                              <span className="font-bold text-[#5a7865]">{formatPHP(totalPaid)}</span>
                            </div>
                            <div>
                              <span className="text-stone-400 block text-[9px]">Left</span>
                              <span className="font-bold text-stone-700">{formatPHP(remaining)}</span>
                            </div>
                          </div>
                          <div className="w-full bg-stone-100 rounded-full h-1.5 overflow-hidden">
                            <div className="bg-[#5a7865] h-full rounded-full transition-all" style={{ width: `${completionPct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {activeTab === 'analytics' && (
                  <div className="bg-white p-5 rounded-2xl border border-stone-200/85 shadow-xs space-y-3">
                    <div>
                      <h3 className="text-sm font-bold text-stone-900">Bi-Monthly Outflow Distribution</h3>
                      <p className="text-[11px] text-stone-400">Debt obligation weight per cutoff period</p>
                    </div>
                    <div className="h-56 flex items-end gap-1.5 pt-4 pb-2 px-1 border-b border-stone-100 overflow-x-auto">
                      {periods.slice(0, 15).map(p => {
                        const pTotal = payments.filter(pmt => pmt.periodId === p.id).reduce((s, pmt) => s + pmt.amount, 0);
                        const heightPct = Math.min((pTotal / 25000) * 100, 100);
                        return (
                          <div key={p.id} className="flex-1 flex flex-col items-center gap-1 min-w-[32px]">
                            <span className="text-[9px] font-bold text-stone-500">₱{(pTotal / 1000).toFixed(0)}k</span>
                            <div className="w-full bg-[#5a7865]/20 rounded-t-sm relative" style={{ height: `${heightPct}%` }}>
                              <div className="bg-[#5a7865] w-full bottom-0 absolute rounded-t-sm" style={{ height: '100%' }}></div>
                            </div>
                            <span className="text-[8px] text-stone-400 rotate-45 origin-left whitespace-nowrap mt-1">{p.name.split(',')[0]}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {activeTab === 'calendar' && (
                  <div className="bg-white p-4 rounded-2xl border border-stone-200/85 shadow-xs space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-bold text-stone-900">Debt Timeline</h3>
                      <span className="text-[10px] text-stone-400 font-semibold">2026–2028 Horizon</span>
                    </div>
                    <div className="divide-y divide-stone-100 max-h-[65vh] overflow-y-auto pr-1">
                      {payments.map(pmt => (
                        <div key={pmt.id} className="py-2.5 flex items-center justify-between text-xs">
                          <div>
                            <p className="font-bold text-stone-900">{pmt.loanName} <span className="font-normal text-stone-400">#{pmt.installmentNumber}</span></p>
                            <p className="text-[10px] text-stone-500">{pmt.periodName}</p>
                            <p className="text-[10px] text-[#4a6b82] font-medium">Due: {formatAlphaDate(pmt.dueDate)}</p>
                          </div>
                          <div className="text-right">
                            <p className="font-bold text-stone-900">{formatPHP(pmt.amount)}</p>
                            <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full inline-block mt-0.5 ${pmt.status === 'PAID' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                              {pmt.status}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>

              {/* iPhone Bottom Navigation Bar */}
              <nav aria-label="Bottom Navigation" className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-stone-200 px-2 pt-2 pb-safe flex justify-around items-center shadow-lg">
                {navItems.map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`flex flex-col items-center justify-center w-14 py-1.5 rounded-xl transition-all ${
                        isActive ? 'text-[#5a7865] font-bold scale-105' : 'text-stone-400 hover:text-stone-700 font-medium'
                      }`}
                    >
                      <Icon className={`w-5 h-5 mb-0.5 ${isActive ? 'stroke-[2.5]' : 'stroke-[1.75]'}`} />
                      <span className="text-[9px] tracking-tight">{item.label}</span>
                    </button>
                  );
                })}
              </nav>

              {/* Modal for Adding Custom Line Item */}
              {isAddPaymentModalOpen && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4 z-50 animate-in fade-in duration-200">
                  <div className="bg-white p-5 rounded-t-3xl sm:rounded-2xl max-w-md w-full space-y-3.5 shadow-2xl max-h-[85vh] overflow-y-auto">
                    <div className="flex justify-between items-center pb-2 border-b border-stone-100">
                      <h3 className="font-bold text-sm text-stone-900">Add Payment Schedule Entry</h3>
                      <button onClick={() => setIsAddPaymentModalOpen(false)} className="p-1 rounded-full text-stone-400 hover:bg-stone-100">
                        <X className="w-4 h-4" />
                      </button>
                    </div>
                    <form onSubmit={handleAddPayment} className="space-y-3 text-xs">
                      <div>
                        <label className="font-semibold text-stone-600 block mb-1">Loan / Biller Name</label>
                        <input
                          type="text"
                          required
                          value={newPayment.loanName}
                          onChange={(e) => setNewPayment({ ...newPayment, loanName: e.target.value })}
                          className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="font-semibold text-stone-600 block mb-1">Installment #</label>
                          <input
                            type="number"
                            required
                            value={newPayment.installmentNumber}
                            onChange={(e) => setNewPayment({ ...newPayment, installmentNumber: e.target.value })}
                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                          />
                        </div>
                        <div>
                          <label className="font-semibold text-stone-600 block mb-1">Amount (₱)</label>
                          <input
                            type="number"
                            step="0.01"
                            required
                            value={newPayment.amount}
                            onChange={(e) => setNewPayment({ ...newPayment, amount: e.target.value })}
                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="font-semibold text-stone-600 block mb-1">Salary Period Cutoff</label>
                        <select
                          value={newPayment.periodId}
                          onChange={(e) => setNewPayment({ ...newPayment, periodId: e.target.value })}
                          className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        >
                          {periods.map(p => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="font-semibold text-stone-600 block mb-1">Actual Loan Due Date</label>
                        <input
                          type="date"
                          required
                          value={newPayment.dueDate}
                          onChange={(e) => setNewPayment({ ...newPayment, dueDate: e.target.value })}
                          className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-stone-600 block mb-1">Remarks</label>
                        <input
                          type="text"
                          value={newPayment.remarks}
                          onChange={(e) => setNewPayment({ ...newPayment, remarks: e.target.value })}
                          className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#5a7865]"
                        />
                      </div>
                      <div className="flex gap-2 pt-3">
                        <button
                          type="button"
                          onClick={() => setIsAddPaymentModalOpen(false)}
                          className="w-1/2 py-2.5 bg-stone-100 text-stone-700 font-semibold rounded-xl hover:bg-stone-200 transition"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 py-2.5 bg-[#5a7865] text-white font-semibold rounded-xl hover:bg-[#4a6554] transition shadow-xs"
                        >
                          Save Entry
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
